name: Nexus OS Edge image

on:
  pull_request:
    paths:
      - "agent/**"
      - "nexus-os/**"
      - ".github/workflows/nexus-os-edge.yml"
  push:
    branches: [main, master]
    paths:
      - "agent/**"
      - "nexus-os/**"
      - ".github/workflows/nexus-os-edge.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the validated image to GitHub Container Registry"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: nexus-os-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-image:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nexus-os-edge
    steps:
      - uses: actions/checkout@v4

      - name: Validate Windows application compatibility catalogue
        run: python nexus-os/catalog/validate_catalog.py

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Authenticate to GitHub Container Registry
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Nexus OS Edge reference image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nexus-os/edge/Containerfile
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          sbom: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}

      - name: Install Cosign
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: sigstore/cosign-installer@v3

      - name: Sign published image digest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Build summary
        run: |
          echo "## Nexus OS Edge" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${IMAGE_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "true" ]; then
            echo "- Registry publication: requested" >> "$GITHUB_STEP_SUMMARY"
            echo "- Supply-chain evidence: Buildx provenance + SBOM + keyless Cosign signature" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Registry publication: disabled (validation build only)" >> "$GITHUB_STEP_SUMMARY"
          fi
