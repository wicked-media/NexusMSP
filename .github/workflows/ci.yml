name: NexusMSP quality gates

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test --watchAll=false --runInBand
        env:
          CI: "true"
      - name: Hook and lint regression budget
        run: pnpm lint:ci
      - name: Control consistency inventory
        run: pnpm audit:controls
      - name: Production build
        run: pnpm build
        env:
          CI: "false"
      - name: Production dependency security
        run: pnpm audit:production

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-not-for-production
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: nexusmsp-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Python lint gate
        run: python -m flake8 app server.py worker.py
      - name: Deterministic unit tests
        run: python scripts/run_unit_tests.py
      - name: Python compile gate
        run: python -m compileall -q app

  tenant-boundary-acceptance:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - name: Disposable two-client API acceptance
        shell: pwsh
        run: ./scripts/Run-NexusAcceptance.ps1 -PythonExecutable python

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: agent/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Build Windows Agent release components
        run: |
          mkdir -p dist
          VERSION=0.1.11-endpoint-readiness
          LDFLAGS="-s -w -X main.Version=${VERSION}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/nexus-agent.exe ./cmd/nexus-agent
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/nexus-client-chat.exe ./cmd/nexus-chat
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" -o dist/nexus-agent-tray.exe ./cmd/nexus-tray
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-agent-windows-components
          path: |
            agent/dist/nexus-agent.exe
            agent/dist/nexus-client-chat.exe
            agent/dist/nexus-agent-tray.exe
          if-no-files-found: error

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --tag nexusmsp-api:ci ./backend
      - name: Build production API image with Agent release components
        run: docker build --tag nexusmsp-api-production:ci --file backend/Dockerfile.production .
      - name: Build web image
        run: docker build --tag nexusmsp-web:ci ./frontend
      - name: Validate production compose model
        env:
          MONGO_USERNAME: ci-user
          MONGO_PASSWORD: ci-password
          JWT_SECRET: ci-only-not-for-production
          NEXUS_SECRET_ENCRYPTION_KEY: ci-only-encryption-key
          NEXUS_DMARC_RECEIVER_TOKEN: ci-only-dmarc-receiver-token
          CORS_ORIGINS: https://nexus.example.invalid
          NEXUS_GRAFANA_ADMIN_PASSWORD: ci-only-dashboard-password
          NEXUS_ALERT_WEBHOOK_URL: https://alerts.example.invalid/nexus
          NEXUS_OBSERVABILITY_INGEST_TOKEN: ci-only-observability-ingest-token
        run: docker compose -f docker-compose.production.yml config --quiet
