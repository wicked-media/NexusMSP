name: NexusMSP quality gates

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test --watchAll=false --runInBand
        env:
          CI: "true"
      - name: Hook and lint regression budget
        run: pnpm lint:ci
      - name: Control consistency inventory
        run: pnpm audit:controls
      - name: Production build
        run: pnpm build
        env:
          CI: "false"
      - name: Production dependency security
        run: pnpm audit:production

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-not-for-production
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: nexusmsp-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Python lint gate
        run: python -m flake8 app server.py worker.py
      - name: Deterministic unit tests
        run: python scripts/run_unit_tests.py
      - name: Python compile gate
        run: python -m compileall -q app

  promotion-recovery-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install drill dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Run promotion recovery drill
        id: drill
        run: python scripts/promotion_recovery_drill.py --evidence-dir artifacts/release-drills
      - name: Upload promotion recovery drill evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-recovery-drill-evidence
          path: artifacts/release-drills/promotion-recovery-drill-*.json
          if-no-files-found: error
          retention-days: 30
      - name: Promotion recovery drill summary
        if: always()
        env:
          DRILL_OUTCOME: ${{ steps.drill.outcome }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          evidence_paths = sorted(
              glob.glob("artifacts/release-drills/promotion-recovery-drill-*.json")
          )
          lines = ["## Promotion recovery drill", ""]
          lines.append(f"- Result: {os.environ['DRILL_OUTCOME']}")
          artifact_url = os.environ.get("ARTIFACT_URL", "")
          if artifact_url:
              lines.append(
                  "- Evidence: [promotion-recovery-drill-evidence]"
                  f"({artifact_url})"
              )
          else:
              lines.append(
                  "- Evidence: artifact upload did not return a URL; "
                  "inspect the job's artifacts."
              )

          if not evidence_paths:
              lines.append(
                  "- Evidence file: not found (the drill may have failed before "
                  "writing it)."
              )
          else:
              try:
                  evidence = json.loads(
                      Path(evidence_paths[-1]).read_text(encoding="utf-8")
                  )
                  if not isinstance(evidence, dict):
                      raise ValueError("evidence is not a JSON object")
              except (OSError, ValueError) as exc:
                  lines.append(f"- Evidence file could not be read: {exc}")
              else:
                  controls = evidence.get("negative_controls", [])
                  lines.append("")
                  lines.append("### Tamper controls")
                  if controls:
                      for control in controls:
                          if not isinstance(control, dict):
                              continue
                          component = str(control.get("component", "unknown")).upper()
                          lines.append(
                              f"- {component} digest: rejected before tagging "
                              f"({control.get('tagged_commands', '?')} tags, "
                              f"{control.get('verified_before_rejection', '?')} "
                              "verified before rejection)"
                          )
                  else:
                      lines.append(
                          "- Not reached; see the retained evidence JSON."
                      )
                  verification = evidence.get("verification", {})
                  if (
                      isinstance(verification, dict)
                      and verification.get(
                          "both_images_have_both_recorded_tags"
                      )
                      is True
                  ):
                      lines.append("")
                      lines.append(
                          "- Positive recovery: both images have both recorded tags."
                      )

          with summary.open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

  tenant-boundary-acceptance:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - name: Disposable two-client API acceptance
        shell: pwsh
        run: ./scripts/Run-NexusAcceptance.ps1 -PythonExecutable python

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: agent/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Build Windows Agent release components
        run: |
          mkdir -p dist
          VERSION=0.1.11-endpoint-readiness
          LDFLAGS="-s -w -X main.Version=${VERSION}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/nexus-agent.exe ./cmd/nexus-agent
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/nexus-client-chat.exe ./cmd/nexus-chat
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" -o dist/nexus-agent-tray.exe ./cmd/nexus-tray
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" -o dist/nexus-remote-companion.exe ./cmd/nexus-remote-companion
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-agent-windows-components
          path: |
            agent/dist/nexus-agent.exe
            agent/dist/nexus-client-chat.exe
            agent/dist/nexus-agent-tray.exe
            agent/dist/nexus-remote-companion.exe
          if-no-files-found: error

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --tag nexusmsp-api:ci ./backend
      - name: Build production API image with Agent release components
        run: docker build --tag nexusmsp-api-production:ci --file backend/Dockerfile.production .
      - name: Build release API image from a verified signed-agent fixture
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = "0.1.20-ci"
          commit = os.environ.get("GITHUB_SHA", "0" * 40)
          components = (
              "nexus-agent.exe",
              "nexus-client-chat.exe",
              "nexus-agent-tray.exe",
              "nexus-remote-companion.exe",
          )
          bundle = Path("signed-bundle")
          dist = bundle / "agent" / "dist"
          signing = bundle / "artifacts" / "agent-signing"
          dist.mkdir(parents=True, exist_ok=True)
          signing.mkdir(parents=True, exist_ok=True)
          (dist / "VERSION").write_text(version + "\n", encoding="utf-8")

          files = []
          sums = []
          for component in components:
              payload = f"{version}:{component}".encode()
              (dist / component).write_bytes(payload)
              digest = hashlib.sha256(payload).hexdigest()
              files.append({
                  "file": component,
                  "sha256_before": digest,
                  "sha256_after": digest,
                  "signed": True,
                  "verified": True,
              })
              sums.append(f"{digest}  {component}")

          evidence = {
              "tool": "signtool",
              "agent_version": version,
              "commit": commit,
              "certificate": {
                  "source": "PfxFile",
                  "thumbprint": "B" * 40,
                  "subject": "CN=Nexus CI Signing Fixture",
              },
              "files": files,
              "verification": "signtool verify /pa",
          }
          (signing / "agent-signing-evidence-20260101T000000Z.json").write_text(
              json.dumps(evidence), encoding="utf-8"
          )
          (signing / "SHA256SUMS.txt").write_text("\n".join(sums) + "\n", encoding="ascii")
          PY
          docker build --tag nexusmsp-api-release:ci --file backend/Dockerfile.release --build-arg NEXUS_AGENT_VERSION=0.1.20-ci .
      - name: Build web image
        run: docker build --tag nexusmsp-web:ci ./frontend
      - name: Validate production compose model
        env:
          MONGO_USERNAME: ci-user
          MONGO_PASSWORD: ci-password
          JWT_SECRET: ci-only-not-for-production
          NEXUS_SECRET_ENCRYPTION_KEY: ci-only-encryption-key
          NEXUS_DMARC_RECEIVER_TOKEN: ci-only-dmarc-receiver-token
          CORS_ORIGINS: https://nexus.example.invalid
          NEXUS_GRAFANA_ADMIN_PASSWORD: ci-only-dashboard-password
          NEXUS_ALERT_WEBHOOK_URL: https://alerts.example.invalid/nexus
          NEXUS_OBSERVABILITY_INGEST_TOKEN: ci-only-observability-ingest-token
        run: docker compose -f docker-compose.production.yml config --quiet
