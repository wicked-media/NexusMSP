global:
  resolve_timeout: 5m

route:
  receiver: nexus-on-call
  group_by: [alertname, service, severity, owner]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: nexus-on-call
    webhook_configs:
      - url: http://api:8000/internal/observability/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/nexus-observability-ingest-token
